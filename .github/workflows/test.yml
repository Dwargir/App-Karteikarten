name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check js/core.js && node --check js/features.js && node --check js/views.js && node --check js/main.js && node --check sw.js
      - run: npm test
